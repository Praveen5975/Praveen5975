<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" role="img" aria-label="Wheels down" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1550"/>
      <stop offset="0.7" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <path id="land" d="M-60,10 C250,20 520,60 880,102"/>
  </defs>
  <rect width="1000" height="140" fill="url(#g)"/>
  <rect y="104" width="1000" height="36" fill="#05070f"/>
