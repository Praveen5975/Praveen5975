    </g>
  </g>
  <text x="500" y="64" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#fff" letter-spacing="4">THANKS FOR FLYING WITH ME</text>
