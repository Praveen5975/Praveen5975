<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" role="img" aria-label="Praveen Balaji G - Cleared for takeoff" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.45" stop-color="#2a1550"/>
      <stop offset="0.75" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.35" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <path id="route" d="M-80,170 C180,170 330,70 540,92 S860,40 1100,70"/>
  </defs>

  <rect width="1000" height="340" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="28" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="75" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="35" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="130" r="1" ><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun -->
  <circle cx="790" cy="262" r="150" fill="url(#sun)"/>
  <circle cx="790" cy="268" r="46" fill="#ffe08a"/>

  <!-- clouds -->
  <g fill="#fff" opacity="0.18">
    <g><ellipse cx="200" cy="215" rx="90" ry="14"/><ellipse cx="250" cy="205" rx="55" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;60,0;0,0" dur="24s" repeatCount="indefinite"/></g>
    <g><ellipse cx="620" cy="190" rx="110" ry="15"/><ellipse cx="570" cy="182" rx="60" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-70,0;0,0" dur="30s" repeatCount="indefinite"/></g>
  </g>

  <!-- flight path -->
  <use href="#route" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </use>

  <!-- plane -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
    <rect x="-150" y="-1.5" width="125" height="3" fill="url(#trail)" rx="1.5"/>
    <g transform="scale(1.25)">
      <path d="M30,0 L10,-4 L-6,-26 L-12,-26 L-4,-4 L-20,-3 L-26,-10 L-30,-10 L-26,0 L-30,10 L-26,10 L-20,3 L-4,4 L-12,26 L-6,26 L10,4 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <circle cx="20" cy="0" r="2" fill="#38bdf8"/>
      <circle cx="-30" cy="-10" r="1.6" fill="#ef4444"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="-30" cy="10" r="1.6" fill="#22c55e"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ground silhouette -->
  <path d="M0,300 L0,285 Q120,255 260,280 T520,285 T780,278 T1000,284 L1000,340 L0,340Z" fill="#0b0f1f"/>
  <rect x="0" y="318" width="1000" height="22" fill="#05070f"/>
  <!-- runway lights -->
  <g fill="#fde68a">
    <circle cx="40" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="329" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="60" y="198" font-size="14" letter-spacing="6" fill="#fde68a" opacity="0.95">CLEARED FOR TAKEOFF</text>
    <text x="58" y="248" font-size="54" font-weight="800" letter-spacing="1">PRAVEEN BALAJI G
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="60" y="280" font-size="17" fill="#e2e8f0" opacity="0.95">CCE Student  •  Software  •  AI / ML  •  Chennai, India</text>
  </g>
</svg>
