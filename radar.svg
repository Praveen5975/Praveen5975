<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" role="img" aria-label="Radar and departure board" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#0f2a1c"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="scope"><circle cx="190" cy="180" r="150"/></clipPath>
  </defs>
  <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="358" rx="16" fill="none" stroke="#14532d" stroke-width="2"/>

  <!-- RADAR -->
  <g stroke="#16a34a" stroke-opacity="0.55" fill="none">
    <circle cx="190" cy="180" r="150" stroke-width="2"/>
    <circle cx="190" cy="180" r="100"/>
    <circle cx="190" cy="180" r="50"/>
    <line x1="40" y1="180" x2="340" y2="180"/>
    <line x1="190" y1="30" x2="190" y2="330"/>
    <line x1="84" y1="74" x2="296" y2="286" stroke-opacity="0.25"/>
    <line x1="296" y1="74" x2="84" y2="286" stroke-opacity="0.25"/>
  </g>
  <g clip-path="url(#scope)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 190 180" to="360 190 180" dur="5s" repeatCount="indefinite"/>
      <path d="M190,180 L340,180 A150,150 0 0 0 330,125 Z" fill="url(#sweep)" transform="rotate(-18 190 180)"/>
      <line x1="190" y1="180" x2="340" y2="180" stroke="#86efac" stroke-width="2"/>
    </g>
  </g>
  <!-- blips (positions on scope) -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#bbf7d0">
    <circle cx="265" cy="120" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.1;1" dur="5s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="r" values="3;7;3" dur="5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <text x="272" y="116">AI/ML</text>
    <circle cx="250" cy="238" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.1;1" dur="5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="3;7;3" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <text x="257" y="254">PYTHON</text>
    <circle cx="132" cy="250" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.1;1" dur="5s" begin="2.9s" repeatCount="indefinite"/><animate attributeName="r" values="3;7;3" dur="5s" begin="2.9s" repeatCount="indefinite"/></circle>
    <text x="72" y="268">IoT</text>
    <circle cx="118" cy="122" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.1;1" dur="5s" begin="4.1s" repeatCount="indefinite"/><animate attributeName="r" values="3;7;3" dur="5s" begin="4.1s" repeatCount="indefinite"/></circle>
    <text x="78" y="112">5G</text>
    <circle cx="190" cy="180" r="4" fill="#fbbf24"/>
    <text x="198" y="198" fill="#fde68a">YOU</text>
  </g>

  <!-- DEPARTURE BOARD -->
  <g font-family="'Courier New', monospace">
    <rect x="400" y="30" width="570" height="300" rx="12" fill="#0b0f1f" stroke="#1e293b"/>
    <text x="425" y="68" font-size="20" fill="#fbbf24" letter-spacing="3">DEPARTURES  -  PRAVEEN BALAJI G</text>
    <line x1="420" y1="82" x2="950" y2="82" stroke="#334155"/>
    <g font-size="14" fill="#94a3b8">
      <text x="425" y="106">GATE</text><text x="500" y="106">DESTINATION</text><text x="790" y="106">STATUS</text>
    </g>

    <g font-size="17" fill="#e2e8f0">
      <text x="425" y="146">A1</text><text x="500" y="146">ARTIFICIAL INTELLIGENCE</text>
      <text x="790" y="146" fill="#4ade80">BOARDING</text>

      <text x="425" y="186">B2</text><text x="500" y="186">SOFTWARE ENGINEERING</text>
      <text x="790" y="186" fill="#4ade80">BOARDING</text>

      <text x="425" y="226">C3</text><text x="500" y="226">IoT  AND  5G SYSTEMS</text>
      <text x="790" y="226" fill="#fbbf24">GATE OPEN</text>

      <text x="425" y="266">D4</text><text x="500" y="266">YOUR INTERNSHIP TEAM</text>
      <text x="790" y="266" fill="#f87171">
        AWAITING CLEARANCE
        <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <line x1="420" y1="288" x2="950" y2="288" stroke="#334155"/>
    <text x="425" y="314" font-size="13" fill="#64748b">NEXT FLIGHT: OPEN TO OPPORTUNITIES - CONTACT VIA LINKEDIN</text>
  </g>
</svg>
